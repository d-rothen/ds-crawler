[project]
name = "ds-crawler"
version = "2.10.0"
description = "Regex-based dataset crawler, indexer, and artifact toolkit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
  { name = "Daniel Rothenpieler", email = "rothenpielerdaniel@gmail.com" },
]
keywords = ["dataset", "indexing", "metadata", "machine-learning", "zip"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "euler-dataset-contract>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/d-rothen/ds-crawler"
Issues = "https://github.com/d-rothen/ds-crawler/issues"
Repository = "https://github.com/d-rothen/ds-crawler"

[project.optional-dependencies]
progress = [
  "tqdm",
]
dev = [
  "pytest",
  "ruff",
  "tqdm",
]

[project.scripts]
ds-crawler = "ds_crawler.cli:main"
build-meta-schema = "meta.build_meta_schema:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ds_crawler", "meta"]

[tool.hatch.build.targets.sdist]
only-include = [
  "CONTRIBUTING.md",
  "LICENSE",
  "SECURITY.md",
  "ds_crawler",
  "docs",
  "examples",
  "meta",
  "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
